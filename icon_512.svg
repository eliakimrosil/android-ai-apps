<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
    <!-- Obsidian Chassis Base Layer -->
    <rect width="108" height="108" rx="24" fill="#090C10" />

    <!-- Studio Console Elevation Frame -->
    <rect x="20" y="18" width="68" height="72" rx="10" fill="#121724" stroke="#243046" stroke-width="1.2" />

    <!-- Radio Transmission Broadcast Waves (Laser Cyan) -->
    <path stroke="#0EA5E9" stroke-width="1.2" stroke-linecap="round" fill="none" d="M34,36a28,28 0 0 1 40,0 M28,30a38,38 0 0 1 52,0" />

    <!-- Mobile Device Screen Frame -->
    <rect x="32" y="22" width="44" height="64" rx="6" fill="#1E2638" stroke="#2F3C54" stroke-width="1.2" />

    <!-- Screen Glass Canvas -->
    <rect x="35" y="26" width="38" height="50" rx="3" fill="#090C10" />

    <!-- Broadcast Antenna Mast & Transmitter Core -->
    <circle cx="54" cy="39" r="5" fill="#00E5FF" />
    <rect x="52.5" y="44" width="3" height="16" fill="#00E5FF" />
    <rect x="48" y="60" width="12" height="2" fill="#00E5FF" />
    <path stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" fill="none" d="M44,35a12,12 0 0 1 20,0 M40,31a18,18 0 0 1 28,0" />

    <!-- Live Recording Ruby Badge -->
    <rect x="38" y="64" width="32" height="9" rx="3" fill="#EF4444" />

    <!-- Live Pulsing Dot -->
    <circle cx="43" cy="68.5" r="1.5" fill="#FFFFFF" />

    <!-- Audio Spectrum EQ Bars -->
    <rect x="52" y="68" width="1.5" height="4" fill="#10B981" />
    <rect x="55" y="66" width="1.5" height="6" fill="#10B981" />
    <rect x="58" y="67" width="1.5" height="5" fill="#F59E0B" />
    <rect x="61" y="65" width="1.5" height="7" fill="#F59E0B" />
    <rect x="64" y="68" width="1.5" height="4" fill="#FFFFFF" />
</svg>