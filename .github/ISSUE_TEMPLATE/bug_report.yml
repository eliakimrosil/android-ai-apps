name: 🐛 Bug Report
description: Report an issue or unexpected behavior in any KIM Android App.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: dropdown
    id: app
    attributes:
      label: Affected Application
      description: Select which application experienced the issue.
      options:
        - KR Live Studio (kim-live-studio)
        - DevSys Monitor (devsys-monitor)
        - ScreenStream RTSP (screenstream-rtsp)
        - Gemini Power Bridge (gemini-power-bridge)
        - ClipScrub Private Share (clip-scrub-sanitize-share)
        - DropScribe Audio (offline-audio-drop-transcribe)
        - IronPulse Workout (workout-program-tracker)
        - FastTrack Fasting (fast-track-intermittent-fasting-sentinel)
        - PanFlip Sear Timer (pan-flip-sear-timer)
        - ChillThaw Meat Defrost (defrost-safe-meat-prep-sentinel)
        - RoastRest Meat Rest (roast-rest-meat-thermo-sentinel)
        - ClampGuard Glue & Epoxy (glue-set-clamp-sentinel)
        - CryoPulse Cold Plunge (steep-chill-ice-bath-timer)
        - SteepPulse Tea & Coffee (steep-brew-tea-timer)
        - SnoozeGuard Commute Vigil (snooze-guard-microsleep-commute)
        - CycleGuard Laundry (laundry-cycle-sentinel)
        - AuraFocus Pomodoro (aurafocus-minimalist-pomodoro-ambient-sound)
        - MeterPulse Parking (tap-meter-parking-sentinel)
        - StealthDrop Ephemeral Pad (stealth-drop-secret-pad)
        - ParkPin Offline Anchor (park-pin-offline-spot-finder)
        - ThawGuard Food Defrost (frost-thaw-prep-timer)
        - TankPulse Fuel Tracker (offline-fuel-log-tracker)
        - DoseGuard Med Sentinel (offline-prescription-pill-refill-sentinel)
        - PH VAT Calculator (ph-vat-calculator)
        - Other / Global
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application Version / Tag
      placeholder: "e.g. v1.2.0-kim-live-studio or v1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android Device & OS Version
      placeholder: "e.g. Lenovo Legion Y70, Android 13 (Snapdragon 8+ Gen 1)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Open app
        2. Tap on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat / Error Output (if available)
      render: shell
