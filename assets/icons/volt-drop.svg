<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#221C16" />
      <stop offset="100%" stop-color="#101216" />
    </radialGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="50%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Technical Circuit Grid -->
  <g stroke="#1F242C" stroke-width="3" opacity="0.6">
    <line x1="85" y1="0" x2="85" y2="512" />
    <line x1="170" y1="0" x2="170" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="341" y1="0" x2="341" y2="512" />
    <line x1="426" y1="0" x2="426" y2="512" />
    <line x1="0" y1="85" x2="512" y2="85" />
    <line x1="0" y1="170" x2="512" y2="170" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="341" x2="512" y2="341" />
    <line x1="0" y1="426" x2="512" y2="426" />
  </g>

  <!-- Outer Gauge Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#262D38" stroke-width="12" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#374151" stroke-width="6" stroke-dasharray="8 12" />

  <!-- Copper Conductor Ring -->
  <circle cx="256" cy="256" r="130" fill="url(#copperGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="100" fill="#2A1B0A" />

  <!-- Inner Telemetry Core -->
  <circle cx="256" cy="256" r="90" fill="#141820" stroke="#00E5FF" stroke-width="4" />

  <!-- Electric Lightning Bolt Symbol -->
  <path d="M265,115 L175,255 L245,255 L225,395 L345,230 L275,230 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Tick Marks -->
  <line x1="256" y1="50" x2="256" y2="80" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="432" x2="256" y2="462" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="256" x2="80" y2="256" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
  <line x1="432" y1="256" x2="462" y2="256" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />
</svg>
