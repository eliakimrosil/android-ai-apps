<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- Cyber grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Glowing atmospheric orbs -->
  <circle cx="150" cy="80" r="160" fill="#00E5FF" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="200" fill="#6366F1" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyanGrad)"/>

  <!-- Left Icon Emblem -->
  <g transform="translate(80, 85)">
    <!-- Outer Shield / Hexagon -->
    <rect x="0" y="0" width="130" height="130" rx="28" fill="#131D33" stroke="#2A3F66" stroke-width="2"/>
    <rect x="6" y="6" width="118" height="118" rx="22" fill="#0A0F1D"/>
    <!-- Android Robot & Craft Core -->
    <path d="M 65 30 L 78 50 L 52 50 Z" fill="#00E5FF"/>
    <circle cx="65" cy="72" r="28" fill="none" stroke="#00E5FF" stroke-width="4"/>
    <circle cx="56" cy="68" r="4" fill="#00E5FF"/>
    <circle cx="74" cy="68" r="4" fill="#00E5FF"/>
    <path d="M 45 80 Q 65 96 85 80" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Orbiting pulse ring -->
    <ellipse cx="65" cy="72" rx="46" ry="18" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-20 65 72)"/>
  </g>

  <!-- Typography -->
  <!-- Tagline pill -->
  <g transform="translate(245, 82)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#131F37" stroke="#223961" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00E5FF"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">BESPOKE ANDROID ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="245" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#cyanGrad)" letter-spacing="-1">KIMROSIL APP STUDIO</text>

  <!-- Subtitle -->
  <text x="245" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    29+ Pure Native, Offline-First Android Utilities Engineered with Zero Bloat &amp; Domain Craftsmanship
  </text>

  <!-- Feature Chips / Badges Row -->
  <g transform="translate(245, 235)">
    <!-- Badge 1: 100% Offline -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10B981">✓ 100% OFFLINE</text>
    </g>
    <!-- Badge 2: Pure Java + XML -->
    <g transform="translate(142, 0)">
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">⚡ PURE NATIVE SDK</text>
    </g>
    <!-- Badge 3: Zero Trackers -->
    <g transform="translate(299, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A855F7">🛡️ ZERO TRACKERS</text>
    </g>
    <!-- Badge 4: Android 13+ Ready -->
    <g transform="translate(449, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F59E0B">📱 ANDROID 13+ (API 33)</text>
    </g>
    <!-- Badge 5: ARM64 Native -->
    <g transform="translate(599, 0)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#131D33" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#EC4899">🚀 SNAPDRAGON 8+ GEN 1</text>
    </g>
  </g>

  <!-- Bottom Terminal / Telemetry Accent Bar -->
  <g transform="translate(80, 310)">
    <rect x="0" y="0" width="1040" height="42" rx="10" fill="#0A0E1A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#10B981"/>
    <text x="35" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#64748B">
      repo: <tspan fill="#38BDF8">eliakimrosil/kimrosil-app-studio</tspan>  |  apps: <tspan fill="#00E5FF">29</tspan>  |  releases: <tspan fill="#10B981">Global CDN</tspan>  |  web: <tspan fill="#A855F7">apps.kimrosil.com</tspan>
    </text>
  </g>
</svg>
